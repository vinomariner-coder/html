<html>
    <head>
        <title>my super hero card</title>
        <style>
            body{
                background-color: darkblue;
                color: white;
                font-family: Arial,sans-serif;
            }
            .hero-name{
                font-size:60px;
                font-weight: bold;
                color-yellow;
                text-shadow:3px 3px orange;
            }
            .tagline{
                font-size: italic;
                color:lightblue;
                text-transform: capitalize;
            }
            .label{
                text-transform: uppercase;
                text-decoration: underline;
                color:coral;
            }
            .power{
                font-weight: bold;
                color: lightgreen;
            }
            .weakness{
                text-decoration:line-through;
                colour:gray;
            }
            .badge{
                font-size: 28px;
                font-weight: bold;
                color:gold;
                transform: rotate(15 deg);
            }
            .made-by{
                color: coral;
                font-size: italic;
       </style>
    </head>
</html>
