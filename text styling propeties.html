<html>
    <head>
        <title>my super hero card</title>
        <style>
            body{
                background-color: darkblue;
                color: white;
                font-family: Arial,sans-serif;
            }
            .hero-name{
                font-size:60px;
                font-weight: bold;
                color :yellow;
                text-shadow:3px 3px orange;
            }
            .tagline{
                font-size: italic;
                color:lightblue;
                text-transform: capitalize;
            }
            .label{
                text-transform: uppercase;
                text-decoration: underline;
                color:coral;
            }
            .power{
                font-weight: bold;
                color: lightgreen;
            }
            .weakness{
                text-decoration:line-through;
                color:gray;
            }
            .badge{
                font-size: 28px;
                font-weight: bold;
                color:gold;
                transform: rotate(15 deg);
            }
            .made-by{
                color: coral;
                font-size: italic;
            }

       </style>
    </head>
<h1 class="hero-name">thunder kid</h1>
<p class="tagline">the most powerful hero in school</p>
<h2 class="label">super powers</h2>
<p class="power">can run faster than a cheetah</p>
<p class="can lift a school bus"></p>
<h3 class="label">weakness</h3>
<p class="weakness">maths homework</p>
<p class="weakness">brocolli</p>

<p class="badge">top hero</p>
<p class="made-by">created by:v.vishak adithya</p>

</html>
