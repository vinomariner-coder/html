            body{

                background-color: lightyellow;
                padding: 65px 30px 30px 30px;

            }
            h1,h2{color:darkorange}
            .top-bar{
                position: fixed;
                top: 0;
                left: 0;
                right:0;

                color: white;
                padding: 14px 20px;
            }
            .list-item{
                background-color: white;
                border: 2px solid darkorange;
                padding: 10px 20px;
            }
            .special-note{
                position: relative;
                left: 30px;
                background-color: gold;
                padding: 10px 20px;
            }
            .pet-card{
                position: relative;
              background-color: white;
                border: 3px solid orange;
                padding: 15px 25px;
            }
            .badge{
                position: absolute;
                top: 8px;
                background-color: forestgreen;
                color: white;
                padding: 4px 8px;
            }
        </style>
    </head>
</html>
